<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Test</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css"/>
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
</head>

<style>
    .result-container {
        margin-top: 20px;
        padding: 20px;
        border: 1px solid #101010;
        border-radius: 5px;
        background-color: #4d6ce7;
    }
    .result{
        font-size: 18px;
        color: #081bc9;
    }
    py-script {
        display: none;
    }
</style>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Best Element Checker in the Universe</a>
        </div>
    </nav>

    <div class="container mt-5" id="Element-Checker">
        <h1 class="text-center">Insert Element Symbol</h1>
    </div>

    <div class="container mt-5" id="elementcontainer">
        <form class="container mt-5" id="elementForm">
            <label for="label" class="form-label">Element Symbol</label>
            <input type="text" class="form-control" id="elementname" placeholder="Enter element symbol">
            <button class="btn btn-primary" id="elementchecker()" pyclick="elementchecker()">click to find the element</button><br><br>
        </form>
    </div>

    <div class="container mt-5" id="resultcontainer">
        <h1 class="text-center">The Element you are looking for is:</h1>
        <div class="container mt-5" id="result"></div>
    </div>

    <py-script src="main.py"></py-script>
</body>
</html>
